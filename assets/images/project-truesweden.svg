<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgts" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c0a1a"/>
      <stop offset="55%" stop-color="#0b0c1c"/>
      <stop offset="100%" stop-color="#061019"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff0099"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#aaff00" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#aaff00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bgts)"/>
  <circle cx="360" cy="50" r="130" fill="#ff0099" opacity=".08"/>
  <circle cx="20" cy="480" r="140" fill="#00c8ff" opacity=".08"/>

  <!-- product card panel -->
  <rect x="32" y="48" width="336" height="404" rx="18" fill="#ffffff" opacity=".03" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- top bar: brand dot + cart -->
  <circle cx="58" cy="76" r="6" fill="#ff0099"/>
  <rect x="290" y="68" width="16" height="16" rx="3" fill="#ffffff" opacity=".12"/>
  <rect x="312" y="68" width="16" height="16" rx="3" fill="#ffffff" opacity=".12"/>

  <!-- AI try-on hero: figure silhouette inside frame with sparkle -->
  <rect x="56" y="98" width="288" height="200" rx="16" fill="#ffffff" opacity=".045"/>
  <circle cx="200" cy="198" r="70" fill="url(#glow)"/>
  <path d="M200 138c-24 0-40 22-40 46 0 30 22 50 40 62 18-12 40-32 40-62 0-24-16-46-40-46z" fill="#ffffff" opacity=".08"/>
  <path d="M200 148c-18 0-30 16-30 34 0 22 16 37 30 46 14-9 30-24 30-46 0-18-12-34-30-34z" fill="#ffffff" opacity=".1"/>

  <!-- sparkle / AI badge -->
  <g transform="translate(266,120)">
    <path d="M10 0 L13 7 L20 10 L13 13 L10 20 L7 13 L0 10 L7 7 Z" fill="#aaff00"/>
  </g>
  <g transform="translate(122,268)">
    <path d="M7 0 L9 5 L14 7 L9 9 L7 14 L5 9 L0 7 L5 5 Z" fill="#00c8ff"/>
  </g>

  <rect x="150" y="264" width="100" height="20" rx="10" fill="url(#tag)" opacity=".85"/>

  <!-- divider -->
  <line x1="56" y1="316" x2="344" y2="316" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- product grid (shop) -->
  <g opacity=".9">
    <rect x="56" y="334" width="86" height="70" rx="10" fill="#ffffff" opacity=".05" stroke="#ff0099" stroke-opacity=".35"/>
    <rect x="157" y="334" width="86" height="70" rx="10" fill="#ffffff" opacity=".05" stroke="#00c8ff" stroke-opacity=".35"/>
    <rect x="258" y="334" width="86" height="70" rx="10" fill="#ffffff" opacity=".05" stroke="#aaff00" stroke-opacity=".35"/>
    <rect x="68" y="380" width="40" height="8" rx="4" fill="#ffffff" opacity=".18"/>
    <rect x="169" y="380" width="40" height="8" rx="4" fill="#ffffff" opacity=".18"/>
    <rect x="270" y="380" width="40" height="8" rx="4" fill="#ffffff" opacity=".18"/>
  </g>

  <!-- price / checkout row -->
  <rect x="56" y="420" width="150" height="18" rx="9" fill="#ffffff" opacity=".08"/>
  <rect x="238" y="416" width="106" height="26" rx="13" fill="url(#tag)" opacity=".9"/>
</svg>
