<svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120a1e"/>
      <stop offset="55%" stop-color="#0b0c1c"/>
      <stop offset="100%" stop-color="#061019"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff0099"/>
      <stop offset="100%" stop-color="#ff0099" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#00c8ff" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aaff00"/>
      <stop offset="100%" stop-color="#aaff00" stop-opacity=".25"/>
    </linearGradient>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <circle cx="40" cy="40" r="120" fill="#ff0099" opacity=".08"/>
  <circle cx="380" cy="470" r="140" fill="#00c8ff" opacity=".08"/>

  <!-- card panel -->
  <rect x="32" y="48" width="336" height="404" rx="18" fill="#ffffff" opacity=".03" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- header row -->
  <circle cx="60" cy="80" r="6" fill="#ff0099"/>
  <circle cx="80" cy="80" r="6" fill="#00c8ff" opacity=".7"/>
  <circle cx="100" cy="80" r="6" fill="#aaff00" opacity=".6"/>
  <rect x="280" y="72" width="60" height="16" rx="8" fill="#ffffff" opacity=".08"/>

  <!-- shift grid: rows = roles, columns = days -->
  <g opacity=".9">
    <!-- row labels as pill dots -->
    <circle cx="58" cy="140" r="5" fill="#ff0099"/>
    <circle cx="58" cy="180" r="5" fill="#00c8ff"/>
    <circle cx="58" cy="220" r="5" fill="#aaff00"/>
    <circle cx="58" cy="260" r="5" fill="#ff0099" opacity=".5"/>

    <!-- grid cells -->
    <g>
      <!-- row 1 -->
      <rect x="80" y="128" width="34" height="24" rx="5" fill="#ff0099" opacity=".55"/>
      <rect x="122" y="128" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>
      <rect x="164" y="128" width="34" height="24" rx="5" fill="#ff0099" opacity=".3"/>
      <rect x="206" y="128" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>
      <rect x="248" y="128" width="34" height="24" rx="5" fill="#ff0099" opacity=".55"/>
      <rect x="290" y="128" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>

      <!-- row 2 -->
      <rect x="80" y="168" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>
      <rect x="122" y="168" width="34" height="24" rx="5" fill="#00c8ff" opacity=".55"/>
      <rect x="164" y="168" width="34" height="24" rx="5" fill="#00c8ff" opacity=".3"/>
      <rect x="206" y="168" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>
      <rect x="248" y="168" width="34" height="24" rx="5" fill="#00c8ff" opacity=".55"/>
      <rect x="290" y="168" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>

      <!-- row 3 -->
      <rect x="80" y="208" width="34" height="24" rx="5" fill="#aaff00" opacity=".45"/>
      <rect x="122" y="208" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>
      <rect x="164" y="208" width="34" height="24" rx="5" fill="#aaff00" opacity=".45"/>
      <rect x="206" y="208" width="34" height="24" rx="5" fill="#aaff00" opacity=".25"/>
      <rect x="248" y="208" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>
      <rect x="290" y="208" width="34" height="24" rx="5" fill="#aaff00" opacity=".45"/>

      <!-- row 4 -->
      <rect x="80" y="248" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>
      <rect x="122" y="248" width="34" height="24" rx="5" fill="#ff0099" opacity=".28"/>
      <rect x="164" y="248" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>
      <rect x="206" y="248" width="34" height="24" rx="5" fill="#ff0099" opacity=".28"/>
      <rect x="248" y="248" width="34" height="24" rx="5" fill="#ffffff" opacity=".06"/>
      <rect x="290" y="248" width="34" height="24" rx="5" fill="#ff0099" opacity=".28"/>
    </g>
  </g>

  <!-- divider -->
  <line x1="56" y1="296" x2="344" y2="296" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- approval flow chips -->
  <rect x="56" y="316" width="92" height="30" rx="15" fill="#ffffff" opacity=".05" stroke="#ff0099" stroke-opacity=".4"/>
  <rect x="156" y="316" width="92" height="30" rx="15" fill="#ffffff" opacity=".05" stroke="#00c8ff" stroke-opacity=".4"/>
  <rect x="256" y="316" width="88" height="30" rx="15" fill="#ffffff" opacity=".05" stroke="#aaff00" stroke-opacity=".4"/>

  <!-- bottom bar chart: load distribution -->
  <g>
    <rect x="70" y="400" width="26" height="50" rx="4" fill="url(#bar1)"/>
    <rect x="112" y="380" width="26" height="70" rx="4" fill="url(#bar2)"/>
    <rect x="154" y="410" width="26" height="40" rx="4" fill="url(#bar1)"/>
    <rect x="196" y="368" width="26" height="82" rx="4" fill="url(#bar3)"/>
    <rect x="238" y="392" width="26" height="58" rx="4" fill="url(#bar2)"/>
    <rect x="280" y="404" width="26" height="46" rx="4" fill="url(#bar1)"/>
  </g>
  <line x1="56" y1="452" x2="344" y2="452" stroke="#ffffff" stroke-opacity=".12"/>
</svg>
